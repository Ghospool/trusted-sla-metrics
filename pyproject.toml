[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trusted-sla-pipeline"
version = "0.1.0"
description = "From Support Tickets to Trusted SLA Metrics: entirely fictional portfolio data"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]

[project.scripts]
sla-pipeline = "sla_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
